  <!-- Three descending bars -->
  <rect x="36" y="46" width="16" height="46" rx="3" fill="#f97316"/>
  <rect x="56" y="58" width="16" height="34" rx="3" fill="#f97316" opacity="0.70"/>
  <rect x="76" y="70" width="16" height="22" rx="3" fill="#f97316" opacity="0.40"/>
  </g>
  <!-- Accent bar bottom -->
  <rect x="0" y="125" width="128" height="3" fill="#f97316"/>
</svg>
