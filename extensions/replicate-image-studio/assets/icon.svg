<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="20" fill="#0f172a"/>
  <!-- CX badge top-right -->
  <text x="108" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="white" opacity="0.4" text-anchor="middle">CX</text>
  <!-- Aperture blades -->
  <g opacity="0.9">
    <ellipse cx="64" cy="42" rx="7" ry="18" fill="#f43f5e" transform="rotate(0 64 64)"/>
    <ellipse cx="64" cy="42" rx="7" ry="18" fill="#f43f5e" transform="rotate(60 64 64)" opacity="0.85"/>
    <ellipse cx="64" cy="42" rx="7" ry="18" fill="#f43f5e" transform="rotate(120 64 64)" opacity="0.85"/>
    <ellipse cx="64" cy="42" rx="7" ry="18" fill="#f43f5e" transform="rotate(30 64 64)" opacity="0.7"/>
    <ellipse cx="64" cy="42" rx="7" ry="18" fill="#f43f5e" transform="rotate(90 64 64)" opacity="0.7"/>
    <ellipse cx="64" cy="42" rx="7" ry="18" fill="#f43f5e" transform="rotate(150 64 64)" opacity="0.7"/>
  </g>
  <circle cx="64" cy="64" r="10" fill="#0f172a"/>
  <circle cx="64" cy="64" r="6" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <!-- Accent bar bottom -->
  <rect x="0" y="125" width="128" height="3" fill="#f43f5e"/>
