  <circle cx="40" cy="82" r="13" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <circle cx="88" cy="82" r="13" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <line x1="55" y1="50" x2="47" y2="71" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="73" y1="50" x2="81" y2="71" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="53" y1="82" x2="75" y2="82" stroke="#f43f5e" stroke-width="2.5"/>
  </g>
  <!-- Accent bar bottom -->
  <rect x="0" y="125" width="128" height="3" fill="#f43f5e"/>
</svg>
