<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    CorreaX Publisher Logo — fabioc-aloha VS Code Marketplace
    Spec: 256×256 · dark bg #0f172a · CX mark sky blue #38bdf8→#0284c7
    Circular-crop safe (all content within r=100px from center 128,128)
    Source: DK-correax-brand.md §2 palette · §4 mark geometry
    Location: Extensions/brand/logos/publisher-logo.svg
    Status: ⬜ Awaiting PUBLISH GATE 1
  -->
  <defs>
    <!-- Sky blue gradient per DK §2 Logo Gradient -->
    <linearGradient id="cx-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Subtle glow filter for CX mark -->
    <filter id="cx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: CorreaX dark base #0f172a -->
  <rect width="256" height="256" fill="#0f172a"/>

  <!--
    CX geometric mark — scale 6.5 from 32×32 origin
    Original bbox: x:2–32, y:2–28 → center (17,15)
    tx = 128 − 17×6.5 = 17.5
    ty = 128 − 15×6.5 = 30.5
    Result: content spans x:30.5–225.5 (±97.5 from center) — within r=128 ✓
    Content spans y:43.5–212.5 (±84.5 from center) — within r=128 ✓
  -->
  <g transform="translate(17.5, 30.5) scale(6.5)" filter="url(#cx-glow)">
    <!-- Broken-circle C-shape (left element of CX) — DK sky blue gradient -->
    <path
      d="M16 2C8.268 2 2 8.268 2 16s6.268 14 14 14c3.866 0 7.389-1.568 9.928-4.1l-3.535-3.536A9.002 9.002 0 0116 25c-4.97 0-9-4.03-9-9s4.03-9 9-9c2.29 0 4.38.857 5.971 2.268l3.464-3.639C22.993 3.352 19.66 2 16 2z"
      fill="url(#cx-sky)"
    />
    <!-- Primary chevron → (right element, full opacity) -->
    <path
      d="M20 10l-4 6 4 6h4l-4-6 4-6h-4z"
      fill="url(#cx-sky)"
    />
    <!-- Secondary chevron → (echo, 45% opacity — slightly more visible than default 50%) -->
    <path
      d="M24 10l4 6-4 6h4l4-6-4-6h-4z"
      fill="url(#cx-sky)"
      opacity="0.45"
    />
  </g>
</svg>
