  <!-- Template: replace {{GLYPH}} and {{ACCENT}} -->
  <rect width="128" height="128" rx="20" fill="#0f172a"/>
  <!-- {{GLYPH}} — white or category accent, scaled 1.4× around centre, minimal padding -->
